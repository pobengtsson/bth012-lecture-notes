<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Chess Game</title>
  <link rel="stylesheet" href="chess.css">
</head>

<body>
  <h1>Classic Chess Game</h1>
  <div class="controls">
    <div>
      <label>
        <input type="checkbox" id="show-moves-white" checked>
        Show Moves (White)
      </label>
    </div>
    <div>
      <label>
        <input type="checkbox" id="show-moves-black" checked>
        Show Moves (Black)
      </label>
    </div>
    <div>
      <label>
        <input type="checkbox" id="toggle-coordinates" checked>
        Show Coordinates
      </label>
    </div>
  </div>

  <div class="game-container">
    <!-- Captured pieces for Black -->
    <div id="captured-black" class="captured-pieces"></div>

    <!-- Chessboard with coordinates -->
    <div class="board-container">
      <!-- Vertical coordinates (left) -->
      <div class="vertical-coords left-coords">
        <div class="coord">8</div>
        <div class="coord">7</div>
        <div class="coord">6</div>
        <div class="coord">5</div>
        <div class="coord">4</div>
        <div class="coord">3</div>
        <div class="coord">2</div>
        <div class="coord">1</div>
      </div>
      <!-- Chessboard -->
      <div id="chess-board" class="chess-board"></div>
      <!-- Vertical coordinates (right) -->
      <div class="vertical-coords right-coords">
        <div class="coord">8</div>
        <div class="coord">7</div>
        <div class="coord">6</div>
        <div class="coord">5</div>
        <div class="coord">4</div>
        <div class="coord">3</div>
        <div class="coord">2</div>
        <div class="coord">1</div>
      </div>
      <!-- Horizontal coordinates (bottom) -->
      <div class="horizontal-coords bottom-coords">
        <div class="coord">A</div>
        <div class="coord">B</div>
        <div class="coord">C</div>
        <div class="coord">D</div>
        <div class="coord">E</div>
        <div class="coord">F</div>
        <div class="coord">G</div>
        <div class="coord">H</div>
      </div>
      <!-- Horizontal coordinates (top) -->
      <div class="horizontal-coords top-coords">
        <div class="coord">A</div>
        <div class="coord">B</div>
        <div class="coord">C</div>
        <div class="coord">D</div>
        <div class="coord">E</div>
        <div class="coord">F</div>
        <div class="coord">G</div>
        <div class="coord">H</div>
      </div>
    </div>

    <!-- Captured pieces for White -->
    <div id="captured-white" class="captured-pieces"></div>
  </div>

  <div id="turn-indicator">Current Turn: <span id="current-player">White</span></div>

  <script type="module" src="chess-game.js"></script>
</body>

</html>
