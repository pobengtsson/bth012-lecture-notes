<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Shooter Game</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB, #f0e68c);
      /* Sky to sand gradient */
    }

    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: url('background.webp') repeat-y;
      /* Optional: Add your background image */
      background-size: cover;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <div id="score">Score: 0</div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 480;
    canvas.height = 640;

    let player = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 60,
      width: 50,
      height: 50,
      speed: 5,
      bullets: [],
      power: 1,
      emoji: '✈️'
    };

    let enemies = [];
    let powerUps = [];
    let score = 0;
    let wave = 1;
    let gameOver = false;

    // Key handling
    let keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
    });
    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function drawPlayer() {
      ctx.font = "40px Arial";
      ctx.textAlign = "center";
      ctx.fillText(player.emoji, player.x + player.width / 2, player.y + player.height);
    }

    function movePlayer() {
      if (keys['ArrowLeft'] && player.x > 0) {
        player.x -= player.speed;
      }
      if (keys['ArrowRight'] && player.x + player.width < canvas.width) {
        player.x += player.speed;
      }
      if (keys['ArrowUp'] && player.y > 0) {
        player.y -= player.speed;
      }
      if (keys['ArrowDown'] && player.y + player.height < canvas.height) {
        player.y += player.speed;
      }
    }

    function shoot() {
      for (let i = 0; i < player.power; i++) {
        player.bullets.push({
          x: player.x + (player.width / (player.power + 1)) * (i + 1) - 2.5,
          y: player.y,
          width: 5,
          height: 10
        });
      }
    }

    function drawBullets() {
      ctx.fillStyle = 'yellow';
      player.bullets.forEach((bullet, index) => {
        bullet.y -= 10;
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

        // Remove bullets off screen
        if (bullet.y < 0) {
          player.bullets.splice(index, 1);
        }
      });
    }

    function createEnemy() {
      enemies.push({
        x: Math.random() * (canvas.width - 50),
        y: -50,
        width: 50,
        height: 50,
        speed: Math.random() * 2 + 1,
        emoji: '🚁'
      });
    }

    function drawEnemies() {
      ctx.font = "40px Arial";
      ctx.textAlign = "center";
      enemies.forEach((enemy, index) => {
        enemy.y += enemy.speed;
        ctx.fillText(enemy.emoji, enemy.x + enemy.width / 2, enemy.y + enemy.height);

        // Check if enemy is off screen
        if (enemy.y > canvas.height) {
          enemies.splice(index, 1);
        }

        // Check collision with player
        if (enemy.x < player.x + player.width &&
          enemy.x + enemy.width > player.x &&
          enemy.y < player.y + player.height &&
          enemy.y + enemy.height > player.y) {
          gameOver = true;
        }

        // Check collision with bullets
        player.bullets.forEach((bullet, bulletIndex) => {
          if (bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y) {
            enemies.splice(index, 1);
            player.bullets.splice(bulletIndex, 1);
            score += 100;
            document.getElementById('score').innerText = `Score: ${score}`;
          }
        });
      });
    }

    function createPowerUp() {
      powerUps.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        emoji: '⭐',
        type: 'power'
      });
    }

    function drawPowerUps() {
      ctx.font = "30px Arial";
      ctx.textAlign = "center";
      powerUps.forEach((powerUp, index) => {
        powerUp.y += 3;
        ctx.fillText(powerUp.emoji, powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height);

        // Check if power-up is off screen
        if (powerUp.y > canvas.height) {
          powerUps.splice(index, 1);
        }

        // Check collision with player
        if (powerUp.x < player.x + player.width &&
          powerUp.x + powerUp.width > player.x &&
          powerUp.y < player.y + player.height &&
          powerUp.y + powerUp.height > player.y) {
          player.power += 1;
          powerUps.splice(index, 1);
        }
      });
    }

    function updateGame() {
      if (gameOver) {
        alert(`Game Over! Your score: ${score}`);
        document.location.reload();
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawPlayer();
      drawBullets();
      drawEnemies();
      drawPowerUps();

      movePlayer();

      // Shoot bullets
      if (keys['Space']) {
        if (player.bullets.length < player.power * 5) { // Limit the number of bullets on screen
          shoot();
        }
      }

      // Spawn enemies and power-ups
      if (Math.random() < 0.03) {
        createEnemy();
      }
      if (Math.random() < 0.005) {
        createPowerUp();
      }

      // Increase wave
      if (enemies.length === 0) {
        wave++;
        for (let i = 0; i < wave * 5; i++) {
          createEnemy();
        }
        createPowerUp();
      }

      requestAnimationFrame(updateGame);
    }

    updateGame();
  </script>
</body>

</html>
