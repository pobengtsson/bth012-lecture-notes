<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Platform Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB;
    }

    canvas {
      display: block;
      background-color: #8B4513;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const player = {
      x: 50,
      y: canvas.height - 150,
      width: 50,
      height: 50,
      speed: 5,
      dx: 0,
      dy: 0,
      gravity: 0.5,
      jumpPower: -10,
      grounded: false,
      color: '🏃‍♂️'
    };

    const keys = {
      right: false,
      left: false,
      up: false
    };

    const platforms = [
      { x: 0, y: canvas.height - 100, width: canvas.width, height: 20 },
      { x: 200, y: canvas.height - 200, width: 200, height: 20 },
      { x: 500, y: canvas.height - 300, width: 200, height: 20 }
    ];

    const coins = [
      { x: 250, y: canvas.height - 250, collected: false, emoji: '💰' },
      { x: 550, y: canvas.height - 350, collected: false, emoji: '💰' }
    ];

    const enemies = [
      { x: 400, y: canvas.height - 130, width: 50, height: 50, color: '👾', dx: 2 }
    ];

    let score = 0;

    function drawPlayer() {
      ctx.font = `${player.width}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(player.color, player.x + player.width / 2, player.y + player.height);
    }

    function drawPlatforms() {
      platforms.forEach(platform => {
        ctx.fillStyle = '#228B22';
        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
      });
    }

    function drawCoins() {
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.font = '30px serif';
          ctx.fillText(coin.emoji, coin.x, coin.y);
        }
      });
    }

    function drawEnemies() {
      enemies.forEach(enemy => {
        ctx.font = `${enemy.width}px serif`;
        ctx.fillText(enemy.color, enemy.x + enemy.width / 2, enemy.y + enemy.height);
      });
    }

    function movePlayer() {
      if (keys.right) {
        player.dx = player.speed;
      } else if (keys.left) {
        player.dx = -player.speed;
      } else {
        player.dx = 0;
      }

      if (keys.up && player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
      }

      player.dy += player.gravity;
      player.x += player.dx;
      player.y += player.dy;

      if (player.y + player.height > canvas.height) {
        player.y = canvas.height - player.height;
        player.grounded = true;
        player.dy = 0;
      }

      platforms.forEach(platform => {
        if (player.x < platform.x + platform.width &&
          player.x + player.width > platform.x &&
          player.y < platform.y + platform.height &&
          player.y + player.height > platform.y) {
          player.grounded = true;
          player.dy = 0;
          player.y = platform.y - player.height;
        }
      });
    }

    function moveEnemies() {
      enemies.forEach(enemy => {
        enemy.x += enemy.dx;

        if (enemy.x < 0 || enemy.x + enemy.width > canvas.width) {
          enemy.dx *= -1;
        }

        if (player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y) {
          alert('Game Over!');
          document.location.reload();
        }
      });
    }

    function collectCoins() {
      coins.forEach(coin => {
        if (!coin.collected &&
          player.x < coin.x + 30 &&
          player.x + player.width > coin.x &&
          player.y < coin.y + 30 &&
          player.y + player.height > coin.y) {
          coin.collected = true;
          score++;
        }
      });
    }

    function drawScore() {
      ctx.font = '20px Arial';
      ctx.fillStyle = '#FFF';
      ctx.fillText('Score: ' + score, 20, 30);
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      movePlayer();
      moveEnemies();
      collectCoins();

      drawPlatforms();
      drawPlayer();
      drawCoins();
      drawEnemies();
      drawScore();

      requestAnimationFrame(update);
    }

    function keyDown(e) {
      if (e.key === 'Right' || e.key === 'ArrowRight') {
        keys.right = true;
      } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
        keys.left = true;
      } else if (e.key === 'Up' || e.key === 'ArrowUp') {
        keys.up = true;
      }
    }

    function keyUp(e) {
      if (e.key === 'Right' || e.key === 'ArrowRight') {
        keys.right = false;
      } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
        keys.left = false;
      } else if (e.key === 'Up' || e.key === 'ArrowUp') {
        keys.up = false;
      }
    }

    document.addEventListener('keydown', keyDown);
    document.addEventListener('keyup', keyUp);

    update();
  </script>
</body>

</html>
