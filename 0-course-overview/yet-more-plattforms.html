<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Platform Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000;
      /* Black background */
      color: #FFFFFF;
      /* White text for the score */
    }

    canvas {
      display: block;
      background-color: #000000;
      /* Black background */
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const player = {
      x: 50,
      y: canvas.height - 150,
      width: 50,
      height: 50,
      speed: 5,
      dx: 0,
      dy: 0,
      gravity: 0.5,
      jumpPower: -10,
      grounded: false,
      color: '👾'
    };

    const keys = {
      right: false,
      left: false,
      up: false,
      down: false
    };

    const platforms = [
      { x: 0, y: canvas.height - 100, width: canvas.width, height: 20 },
      { x: 100, y: canvas.height - 200, width: 300, height: 20 },
      { x: 450, y: canvas.height - 300, width: 300, height: 20 },
      { x: 200, y: canvas.height - 400, width: 250, height: 20 },
      { x: 700, y: canvas.height - 500, width: 200, height: 20 },
      { x: 50, y: canvas.height - 600, width: 150, height: 20 },
    ];

    const ladders = [
      { x: 350, y: canvas.height - 400, width: 20, height: 100, color: '#FFD700' },
      { x: 550, y: canvas.height - 500, width: 20, height: 100, color: '#FFD700' },
    ];

    const coins = [
      { x: 150, y: canvas.height - 230, collected: false, emoji: '💰' },
      { x: 500, y: canvas.height - 330, collected: false, emoji: '💰' },
      { x: 300, y: canvas.height - 430, collected: false, emoji: '💰' },
      { x: 750, y: canvas.height - 530, collected: false, emoji: '💰' },
      { x: 100, y: canvas.height - 170, collected: false, emoji: '💰' },
      { x: 600, y: canvas.height - 430, collected: false, emoji: '💰' },
      { x: 200, y: canvas.height - 270, collected: false, emoji: '💰' },
      { x: 650, y: canvas.height - 430, collected: false, emoji: '💰' },
      { x: 400, y: canvas.height - 500, collected: false, emoji: '💰' }
    ];

    const enemies = [
      { x: 400, y: canvas.height - 130, width: 50, height: 50, color: '👹', dx: 1.5 },
      { x: 600, y: canvas.height - 330, width: 50, height: 50, color: '👹', dx: -1.5 }
    ];

    const npcs = [
      { x: 600, y: canvas.height - 550, width: 50, height: 50, color: '🧙‍♂️', dx: 1 }
    ];

    let score = 0;

    function drawPlayer() {
      ctx.font = `${player.width}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(player.color, player.x + player.width / 2, player.y + player.height);
    }

    function drawPlatforms() {
      platforms.forEach(platform => {
        ctx.fillStyle = '#00FF00'; // Bright Green platforms
        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
      });
    }

    function drawLadders() {
      ladders.forEach(ladder => {
        ctx.fillStyle = ladder.color;
        ctx.fillRect(ladder.x, ladder.y, ladder.width, ladder.height);
      });
    }

    function drawCoins() {
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.font = '30px serif';
          ctx.fillText(coin.emoji, coin.x, coin.y);
        }
      });
    }

    function drawEnemies() {
      enemies.forEach(enemy => {
        ctx.font = `${enemy.width}px serif`;
        ctx.fillText(enemy.color, enemy.x + enemy.width / 2, enemy.y + enemy.height);
      });
    }

    function drawNPCs() {
      npcs.forEach(npc => {
        ctx.font = `${npc.width}px serif`;
        ctx.fillText(npc.color, npc.x + npc.width / 2, npc.y + npc.height);
      });
    }

    function movePlayer() {
      if (keys.right) {
        player.dx = player.speed;
      } else if (keys.left) {
        player.dx = -player.speed;
      } else {
        player.dx = 0;
      }

      if (keys.up && player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
      }

      if (keys.up && isOnLadder(player)) {
        player.dy = -player.speed / 2;
      } else if (keys.down && isOnLadder(player)) {
        player.dy = player.speed / 2;
      } else {
        player.dy += player.gravity;
      }

      player.x += player.dx;
      player.y += player.dy;

      if (player.y + player.height > canvas.height) {
        player.y = canvas.height - player.height;
        player.grounded = true;
        player.dy = 0;
      }

      platforms.forEach(platform => {
        if (player.x < platform.x + platform.width &&
          player.x + player.width > platform.x &&
          player.y < platform.y + platform.height &&
          player.y + player.height > platform.y) {
          player.grounded = true;
          player.dy = 0;
          player.y = platform.y - player.height;
        }
      });
    }

    function moveEnemies() {
      enemies.forEach((enemy, index) => {
        enemy.x += enemy.dx;

        if (enemy.x < 0 || enemy.x + enemy.width > canvas.width) {
          enemy.dx *= -1;
        }

        // Check if player lands on top of enemy
        if (player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y + player.height > enemy.y &&
          player.y < enemy.y) {
          // Eliminate enemy and increase score
          if (player.dy > 0) { // Ensure player is falling onto the enemy
            enemies.splice(index, 1);
            score += 5; // Increase score for eliminating enemy
            player.dy = player.jumpPower / 2; // Small jump after eliminating enemy
          } else {
            alert('Game Over!');
            document.location.reload();
          }
        }
      });
    }

    function moveNPCs() {
      npcs.forEach(npc => {
        npc.x += npc.dx;

        // Make NPCs move along platforms
        platforms.forEach(platform => {
          if (npc.x + npc.width > platform.x + platform.width || npc.x < platform.x) {
            npc.dx *= -1; // Reverse direction if NPC reaches edge of the platform
          }
        });
      });
    }

    function collectCoins() {
      coins.forEach(coin => {
        if (!coin.collected &&
          player.x < coin.x + 30 &&
          player.x + player.width > coin.x &&
          player.y < coin.y + 30 &&
          player.y + player.height > coin.y) {
          coin.collected = true;
          score++;
        }
      });
    }

    function isOnLadder(player) {
      return ladders.some(ladder => {
        return player.x + player.width > ladder.x &&
          player.x < ladder.x + ladder.width &&
          player.y + player.height > ladder.y &&
          player.y < ladder.y + ladder.height;
      });
    }

    function drawScore() {
      ctx.font = '20px Arial';
      ctx.fillStyle = '#FFF';
      ctx.fillText('Score: ' + score, 20, 30);
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      movePlayer();
      moveEnemies();
      moveNPCs();
      collectCoins();

      drawPlatforms();
      drawLadders();
      drawPlayer();
      drawCoins();
      drawEnemies();
      drawNPCs();
      drawScore();

      requestAnimationFrame(update);
    }

    function keyDown(e) {
      if (e.key === 'Right' || e.key === 'ArrowRight') {
        keys.right = true;
      } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
        keys.left = true;
      } else if (e.key === 'Up' || e.key === 'ArrowUp') {
        keys.up = true;
      } else if (e.key === 'Down' || e.key === 'ArrowDown') {
        keys.down = true;
      }
    }

    function keyUp(e) {
      if (e.key === 'Right' || e.key === 'ArrowRight') {
        keys.right = false;
      } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
        keys.left = false;
      } else if (e.key === 'Up' || e.key === 'ArrowUp') {
        keys.up = false;
      } else if (e.key === 'Down' || e.key === 'ArrowDown') {
        keys.down = false;
      }
    }

    document.addEventListener('keydown', keyDown);
    document.addEventListener('keyup', keyUp);

    update();
  </script>
</body>

</html>
