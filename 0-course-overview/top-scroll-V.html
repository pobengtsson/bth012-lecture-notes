<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Shooter Game with Formation Movement</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB, #f0e68c);
      /* Sky to sand gradient */
    }

    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: url('background.webp') repeat-y;
      /* Optional: Add your background image */
      background-size: cover;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <div id="score">Score: 0</div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 480;
    canvas.height = 640;

    let player = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 60,
      width: 50,
      height: 50,
      speed: 5,
      bullets: [],
      backwardBullets: [],
      power: 1,
      backwardPower: 0,
      emoji: '✈️'
    };

    let wingman = {
      x: player.x - 60,
      y: player.y,
      width: 50,
      height: 50,
      bullets: [],
      backwardBullets: [],
      power: 0,
      backwardPower: 0,
      emoji: '🚀',
      active: false
    };

    let enemies = [];
    let powerUps = [];
    let bombs = [];
    let score = 0;
    let wave = 1;
    let gameOver = false;

    // Key handling
    let keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
    });
    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function drawPlayer() {
      ctx.font = "40px Arial";
      ctx.textAlign = "center";
      ctx.fillText(player.emoji, player.x + player.width / 2, player.y + player.height);

      if (wingman.active) {
        wingman.x = player.x - 60;
        wingman.y = player.y;
        ctx.fillText(wingman.emoji, wingman.x + wingman.width / 2, wingman.y + wingman.height);
      }
    }

    function movePlayer() {
      if (keys['ArrowLeft'] && player.x > 0) {
        player.x -= player.speed;
      }
      if (keys['ArrowRight'] && player.x + player.width < canvas.width) {
        player.x += player.speed;
      }
      if (keys['ArrowUp'] && player.y > 0) {
        player.y -= player.speed;
      }
      if (keys['ArrowDown'] && player.y + player.height < canvas.height) {
        player.y += player.speed;
      }
    }

    function shoot() {
      for (let i = 0; i < player.power; i++) {
        player.bullets.push({
          x: player.x + (player.width / (player.power + 1)) * (i + 1) - 2.5,
          y: player.y,
          width: 5,
          height: 10
        });
      }

      if (player.backwardPower > 0) {
        for (let i = 0; i < player.backwardPower; i++) {
          player.backwardBullets.push({
            x: player.x + (player.width / (player.backwardPower + 1)) * (i + 1) - 2.5,
            y: player.y + player.height,
            width: 5,
            height: 10
          });
        }
      }

      if (wingman.active && wingman.power > 0) {
        for (let i = 0; i < wingman.power; i++) {
          wingman.bullets.push({
            x: wingman.x + (wingman.width / (wingman.power + 1)) * (i + 1) - 2.5,
            y: wingman.y,
            width: 5,
            height: 10
          });
        }
      }

      if (wingman.active && wingman.backwardPower > 0) {
        for (let i = 0; i < wingman.backwardPower; i++) {
          wingman.backwardBullets.push({
            x: wingman.x + (wingman.width / (wingman.backwardPower + 1)) * (i + 1) - 2.5,
            y: wingman.y + wingman.height,
            width: 5,
            height: 10
          });
        }
      }
    }

    function drawBullets() {
      ctx.fillStyle = 'yellow';
      player.bullets.forEach((bullet, index) => {
        bullet.y -= 10;
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

        // Remove bullets off screen
        if (bullet.y < 0) {
          player.bullets.splice(index, 1);
        }
      });

      player.backwardBullets.forEach((bullet, index) => {
        bullet.y += 10;
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

        // Remove bullets off screen
        if (bullet.y > canvas.height) {
          player.backwardBullets.splice(index, 1);
        }
      });

      if (wingman.active) {
        wingman.bullets.forEach((bullet, index) => {
          bullet.y -= 10;
          ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

          // Remove bullets off screen
          if (bullet.y < 0) {
            wingman.bullets.splice(index, 1);
          }
        });

        wingman.backwardBullets.forEach((bullet, index) => {
          bullet.y += 10;
          ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

          // Remove bullets off screen
          if (bullet.y > canvas.height) {
            wingman.backwardBullets.splice(index, 1);
          }
        });
      }
    }

    function createEnemyFormation(wave) {
      const numEnemies = Math.min(10, wave); // Limit the number of enemies per wave
      const startX = -50; // Start slightly off-screen to the left
      const spacing = 60; // Space between enemies

      for (let i = 0; i < numEnemies; i++) {
        enemies.push({
          x: startX - i * spacing,
          y: 50 + i * 40, // Staggered vertical position
          width: 50,
          height: 50,
          speed: 2 + wave * 0.2, // Slightly increase speed with each wave
          emoji: '🚁',
          direction: 1 // Start moving to the right
        });
      }
    }

    function drawEnemies() {
      ctx.font = "40px Arial";
      ctx.textAlign = "center";
      enemies.forEach((enemy, index) => {
        enemy.x += enemy.speed * enemy.direction;

        if (enemy.x > canvas.width) {
          enemy.direction = -1;
          enemy.y += 40; // Move down after reaching the right edge
        } else if (enemy.x < -50) {
          enemy.direction = 1;
          enemy.y += 40; // Move down after reaching the left edge
        }

        ctx.fillText(enemy.emoji, enemy.x + enemy.width / 2, enemy.y + enemy.height);

        // Check if enemy is off screen vertically
        if (enemy.y > canvas.height) {
          enemies.splice(index, 1);
        }

        // Check collision with player
        if (enemy.x < player.x + player.width &&
          enemy.x + enemy.width > player.x &&
          enemy.y < player.y + player.height &&
          enemy.y + enemy.height > player.y) {
          gameOver = true;
        }

        // Check collision with bullets
        player.bullets.forEach((bullet, bulletIndex) => {
          if (bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y) {
            enemies.splice(index, 1);
            player.bullets.splice(bulletIndex, 1);
            score += 100;
            document.getElementById('score').innerText = `Score: ${score}`;
          }
        });

        player.backwardBullets.forEach((bullet, bulletIndex) => {
          if (bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y) {
            enemies.splice(index, 1);
            player.backwardBullets.splice(bulletIndex, 1);
            score += 100;
            document.getElementById('score').innerText = `Score: ${score}`;
          }
        });

        if (wingman.active) {
          wingman.bullets.forEach((bullet, bulletIndex) => {
            if (bullet.x < enemy.x + enemy.width &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + enemy.height &&
              bullet.y + bullet.height > enemy.y) {
              enemies.splice(index, 1);
              wingman.bullets.splice(bulletIndex, 1);
              score += 100;
              document.getElementById('score').innerText = `Score: ${score}`;
            }
          });

          wingman.backwardBullets.forEach((bullet, bulletIndex) => {
            if (bullet.x < enemy.x + enemy.width &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + enemy.height &&
              bullet.y + bullet.height > enemy.y) {
              enemies.splice(index, 1);
              wingman.backwardBullets.splice(bulletIndex, 1);
              score += 100;
              document.getElementById('score').innerText = `Score: ${score}`;
            }
          });
        }
      });
    }

    function createPowerUp() {
      powerUps.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        emoji: '⭐',
        type: 'power'
      });
    }

    function createBomb() {
      bombs.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        emoji: '💣'
      });
    }

    function drawPowerUps() {
      ctx.font = "30px Arial";
      ctx.textAlign = "center";
      powerUps.forEach((powerUp, index) => {
        powerUp.y += 3;
        ctx.fillText(powerUp.emoji, powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height);

        // Check if power-up is off screen
        if (powerUp.y > canvas.height) {
          powerUps.splice(index, 1);
        }

        // Check collision with player
        if (powerUp.x < player.x + player.width &&
          powerUp.x + powerUp.width > player.x &&
          powerUp.y < player.y + player.height &&
          powerUp.y + powerUp.height > player.y) {
          if (player.power < 5) {
            player.power += 1;
          } else if (!wingman.active) {
            wingman.active = true;
            wingman.power = 1;
          } else if (wingman.power < 5) {
            wingman.power += 1;
          } else if (player.backwardPower < 5) {
            player.backwardPower += 1;
          } else if (wingman.backwardPower < 5) {
            wingman.backwardPower += 1;
          }
          powerUps.splice(index, 1);
        }
      });
    }

    function drawBombs() {
      ctx.font = "30px Arial";
      ctx.textAlign = "center";
      bombs.forEach((bomb, index) => {
        bomb.y += 3;
        ctx.fillText(bomb.emoji, bomb.x + bomb.width / 2, bomb.y + bomb.height);

        // Check if bomb is off screen
        if (bomb.y > canvas.height) {
          bombs.splice(index, 1);
        }

        // Check collision with player
        if (bomb.x < player.x + player.width &&
          bomb.x + bomb.width > player.x &&
          bomb.y < player.y + player.height &&
          bomb.y + bomb.height > player.y) {
          enemies = [];  // Clear all enemies
          bombs.splice(index, 1);
          score += 500;  // Bonus points for clearing the screen
          document.getElementById('score').innerText = `Score: ${score}`;
        }
      });
    }

    function updateGame() {
      if (gameOver) {
        alert(`Game Over! Your score: ${score}`);
        document.location.reload();
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawPlayer();
      drawBullets();
      drawEnemies();
      drawPowerUps();
      drawBombs();

      movePlayer();

      // Shoot bullets
      if (keys['Space']) {
        shoot();
      }

      // Spawn enemies, power-ups, and bombs
      if (enemies.length === 0) {
        createEnemyFormation(wave);
        wave++;
        createPowerUp();
      }

      if (Math.random() < 0.005) {
        createPowerUp();
      }
      if (Math.random() < 0.002) {
        createBomb();
      }

      requestAnimationFrame(updateGame);
    }

    updateGame();
  </script>
</body>

</html>
